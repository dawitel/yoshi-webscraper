name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ebay-rank-checker:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ebay-rank-checker:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull latest Docker image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/ebay-rank-checker:latest

      - name: Remove existing container if exists
        run: |
          docker rm -f ebay-rank-checker-app || true

      - name: Run Docker container
        run: |
          docker run -d -p 3000:3000 --name ebay-rank-checker-app ${{ secrets.DOCKER_USERNAME }}/ebay-rank-checker:latest
